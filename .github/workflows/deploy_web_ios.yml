name: Desplegar ERP NOVACONCRET Web (iOS / PWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar versión Web para iPhone / PWA
        run: flutter build web --release --base-href /La_roca_erp/

      - name: Crear 404.html para navegación directa en SPA
        run: cp build/web/index.html build/web/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
