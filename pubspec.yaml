name: app_database
description: "ERP La Roca - Gestión Integral"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  intl: ^0.20.2
  http: ^1.6.0
  csv: ^7.2.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.2
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  window_manager: ^0.5.1 
  pdf: ^3.11.3         
  printing: ^5.14.2      
  excel: ^4.0.6  
  latlong2: ^0.9.1
  flutter_map: ^8.3.0
  flutter_mjpeg: ^2.0.3
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^3.15.2
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.0.0
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0

dev_dependencies: 
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  http: ^1.6.0

flutter:
  uses-material-design: true

  # 👉 Asegúrate de que el logo esté bien declarado aquí
  assets:
    - assets/images/LOGO2023.png


flutter_native_splash:
  color: "#ffffff" # Color de fondo de la pantalla de carga
  image: assets/images/logo.png # Ruta de tu logo
  android_12:
    image: assets/images/logo.png # Para versiones nuevas de Android
    color: "#ffffff"  
      
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"      